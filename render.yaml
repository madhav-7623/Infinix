services:
  - type: web
    name: ev-chargesync
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login.html
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: apple
      - key: CHARGESYNC_CORS_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: SESSION_COOKIE_SAME_SITE
        value: None
      - key: SESSION_COOKIE_SECURE
        value: "true"
